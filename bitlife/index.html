<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BitVida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: una sola columna tipo teléfono — cabecera, bitácora de vida, barra de acciones y estadísticas abajo */
:root{
  --page:#dfe4ec; --app:#ffffff; --surface:#ffffff; --surface-2:#f2f4f8; --line:#e3e7ee;
  --fg:#1b2130; --fg-2:#465063; --muted:#8a93a4;
  --blue:#2f80ed; --blue-d:#1d63c4; --green:#34c759; --green-d:#1f9e45; --money:#169a45;
  --occ:#2f80ed; --ast:#16a865; --rel:#ec4766; --act:#8650e0; --dark:#2c3446;
  --red:#e8403a; --red-d:#b92c27; --orange:#f39028; --yellow:#efc21e; --lime:#93c83a; --good:#37c05a;
  --year:#2a68cc; --card:#ffffff; --card-fg:#161616;
  --overlay:rgba(12,18,32,.55); --shadow:0 10px 30px rgba(16,24,40,.22);
  --font:'Nunito', ui-rounded, 'Segoe UI Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#07090d; --app:#12161e; --surface:#181d27; --surface-2:#212736; --line:#2a3141;
    --fg:#eef1f7; --fg-2:#b9c1d0; --muted:#7f899c;
    --blue:#3d8cf5; --blue-d:#2366c2; --money:#3ccf6b; --year:#6ea6ff; --dark:#3a4359;
    --overlay:rgba(0,0,0,.65); --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#07090d; --app:#12161e; --surface:#181d27; --surface-2:#212736; --line:#2a3141;
  --fg:#eef1f7; --fg-2:#b9c1d0; --muted:#7f899c;
  --blue:#3d8cf5; --blue-d:#2366c2; --money:#3ccf6b; --year:#6ea6ff; --dark:#3a4359;
  --overlay:rgba(0,0,0,.65); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--app);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* ---------- Cabecera ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.menu-btn{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);color:var(--fg-2);display:grid;place-items:center;cursor:pointer;flex:none}
.menu-btn svg{width:20px;height:20px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:28px;flex:none;border:2px solid var(--line)}
.who{flex:1;min-width:0}
.who .nm{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.who .oc{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank{text-align:right;flex:none}
.bank .amt{color:var(--money);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.bank .amt.neg{color:var(--red)}
.bank .lb{font-size:11px;color:var(--muted);font-weight:700}

/* ---------- Bitácora ---------- */
.log{flex:1;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.yr{padding:12px 0 10px;border-bottom:1px solid var(--line)}
.yr:last-child{border-bottom:0}
.yr h4{margin:0 0 4px;color:var(--year);font-weight:900;font-size:15px}
.yr p{margin:3px 0;font-size:14.5px;line-height:1.42;color:var(--fg-2)}
.yr p.good{color:var(--green-d)}
.yr p.bad{color:var(--red)}
.yr p.em{color:var(--fg);font-weight:800}
.yr p.gold{color:#c48a00;font-weight:800}
.log-end{height:4px}

/* ---------- Barra inferior ---------- */
.nav{display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:4px 6px 2px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-2);font:800 11.5px var(--font);padding:6px 0 4px;cursor:pointer;border-radius:12px}
.nav button:active{transform:scale(.95)}
.nav .ico{width:40px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff}
.nav .ico svg{width:22px;height:22px}
.nav .b-occ .ico{background:var(--occ)} .nav .b-ast .ico{background:var(--ast)}
.nav .b-rel .ico{background:var(--rel)} .nav .b-act .ico{background:var(--act)}
.nav .age .circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,#5fe07a 0%,#2fbf55 55%,#22a246 100%);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 5px 0 #18803a,0 8px 18px rgba(34,162,70,.45);border:4px solid var(--surface)}
.nav .age .circle span{font-size:38px;font-weight:900;line-height:1;margin-top:-4px}
.nav .age{color:var(--green-d)}
.nav .age:disabled .circle{filter:grayscale(1);opacity:.6}

/* ---------- Estadísticas ---------- */
.stats{padding:6px 16px 12px;background:var(--surface);display:grid;gap:5px;flex:none}
.st{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--fg)}
.st .lbl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.st .lbl em{font-style:normal;font-size:17px;width:20px;text-align:center}
.st .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.bar{height:15px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.9,.3,1),background-color .6s}
.st.flash .pct{animation:flash .9s}
@keyframes flash{0%{transform:scale(1.35);color:var(--fg)}100%{transform:none}}

/* ---------- Hojas (menús) ---------- */
.sheet{position:absolute;inset:0;background:var(--surface-2);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:20}
.sheet.in{transform:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 12px;color:#fff;background:var(--c,var(--blue));flex:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sh-h h2{flex:1;text-align:center;margin:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:22px;font-weight:900;cursor:pointer;display:grid;place-items:center;flex:none}
.sh-h .sp{width:38px;flex:none}
.sh-b{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 4px 7px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left;font:inherit;color:inherit}
.row:last-child{border-bottom:0}
.row:hover:not([disabled]){background:var(--surface-2)}
.row .ic{width:42px;height:42px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:23px;flex:none}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:800;font-size:15px;line-height:1.2}
.row .s{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.row .r{font-weight:900;color:var(--money);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .r.neg{color:var(--red)}
.row .ch{color:var(--muted);font-size:22px;font-weight:700;line-height:1}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .mb{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px;max-width:180px}
.row .mb i{display:block;height:100%;border-radius:4px}
.note{padding:14px;color:var(--muted);font-weight:700;text-align:center;font-size:14px}

/* tarjeta de perfil dentro de hojas */
.prof{background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:16px;margin-top:14px;display:grid;gap:10px}
.prof-top{display:flex;align-items:center;gap:14px}
.prof-av{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:38px;flex:none}
.prof-nm{font-weight:900;font-size:19px;line-height:1.15}
.prof-sub{color:var(--muted);font-weight:700;font-size:13px}
.kv{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:8px;font-size:13px;font-weight:800}
.kv .v{color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums}
.kv2{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:700;color:var(--fg-2)}
.kv2 b{color:var(--fg);text-align:right}

/* ---------- Ventanas emergentes ---------- */
.pop-wrap{position:absolute;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .18s ease}
.pop{width:100%;max-width:370px;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);animation:popIn .3s cubic-bezier(.2,1.35,.4,1);max-height:calc(100% - 8px);display:flex;flex-direction:column}
.pop-h{background:var(--pc,var(--blue));color:#fff;padding:16px 16px 14px;text-align:center;flex:none}
.pop-ic{font-size:46px;line-height:1.1;display:block;margin-bottom:4px}
.pop-h h3{margin:0;font-size:19px;font-weight:900;text-wrap:balance}
.pop-b{padding:16px 18px 18px;text-align:center;font-size:15.5px;line-height:1.45;color:var(--fg-2);overflow-y:auto}
.pop-b p{margin:0 0 4px;white-space:pre-line}
.pop-btns{display:grid;gap:9px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:12px 14px;font:800 15px var(--font);color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 3px 0 var(--blue-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.btn.green{background:var(--good);box-shadow:0 3px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 3px 0 var(--red-d)}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pop input,.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 16px var(--font);margin-top:12px}
@keyframes fade{from{opacity:0}}
@keyframes popIn{from{transform:scale(.8);opacity:0}}

/* ---------- Pantallas completas ---------- */
.screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;overflow-y:auto;background:var(--app)}
.start{background:linear-gradient(170deg,#2f80ed 0%,#1d5fd0 45%,#123e95 100%);color:#fff;padding:28px 20px 24px;align-items:center;text-align:center;gap:14px}
.logo{font-size:56px;font-weight:900;letter-spacing:-.02em;margin:24px 0 0;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.logo span{color:#7dff9b}
.tag{font-weight:800;opacity:.85;margin:0 0 8px}
.start .faces{font-size:40px;letter-spacing:4px;margin:6px 0 10px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.start .btn{width:100%;max-width:330px;font-size:17px;padding:15px}
.start .btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.start small{opacity:.75;font-weight:700;margin-top:auto;font-size:12px}
.form{width:100%;max-width:340px;background:rgba(255,255,255,.12);border-radius:18px;padding:14px;display:grid;gap:4px;text-align:left}
.form label{font-weight:800;font-size:13px;margin-top:8px;opacity:.9}
.form input,.form select{width:100%;padding:11px 12px;border-radius:12px;border:0;font:700 15px var(--font);color:#1b2130;background:#fff;margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.seg button{padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:800 15px var(--font);cursor:pointer}
.seg button.on{background:#fff;color:#1d5fd0;border-color:#fff}

/* muerte */
.death{background:var(--surface-2);padding:0 0 24px}
.death-h{background:linear-gradient(180deg,#3b4254,#232836);color:#fff;text-align:center;padding:26px 16px 70px}
.death-h h2{margin:0;font-size:24px;font-weight:900}
.death-h p{margin:4px 0 0;opacity:.8;font-weight:700}
.stone{width:190px;margin:-60px auto 0;background:linear-gradient(180deg,#b8bec9,#8d94a1);border-radius:95px 95px 14px 14px;padding:34px 14px 18px;text-align:center;color:#2b2f38;box-shadow:0 10px 0 #6d7380,0 16px 30px rgba(0,0,0,.25)}
.stone .rip{font-weight:900;font-size:22px;letter-spacing:.12em}
.stone .dn{font-weight:900;font-size:16px;margin-top:8px;line-height:1.2}
.stone .dy{font-weight:800;font-size:13px;opacity:.8;margin-top:4px}
.death-b{padding:22px 16px 0;display:grid;gap:12px}
.ribbon{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ribbon .rb{width:52px;height:60px;display:grid;place-items:center;font-size:26px;background:var(--rbc,#f1c40f);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);color:#fff;flex:none}
.ribbon b{font-size:17px;font-weight:900;display:block}
.ribbon span{color:var(--muted);font-weight:700;font-size:13px}

/* casino */
.table{background:radial-gradient(ellipse at center,#1f8a4c,#0f5c31);border-radius:18px;padding:16px;color:#fff;margin-top:14px;display:grid;gap:12px;text-align:center}
.hand{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:70px}
.card{width:46px;height:66px;border-radius:7px;background:var(--card);color:var(--card-fg);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:900;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.35);animation:deal .3s ease}
.card.r{color:#d0242b}
.card .sb{align-self:flex-end;font-size:18px}
.card.back{background:repeating-linear-gradient(45deg,#c0392b 0 6px,#a93226 6px 12px);border:3px solid #fff}
@keyframes deal{from{transform:translateY(-14px) rotate(-6deg);opacity:0}}
.table .lbl{font-weight:800;opacity:.9;font-size:13px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{width:58px;height:58px;border-radius:50%;border:4px dashed rgba(255,255,255,.75);font:900 12px var(--font);color:#fff;cursor:pointer}
.chip.on{outline:3px solid #ffe066;outline-offset:2px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.track{display:grid;gap:6px;margin-top:14px}
.lane{position:relative;height:38px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lane .fin{position:absolute;right:8px;top:0;bottom:0;width:4px;background:repeating-linear-gradient(0deg,var(--fg) 0 5px,transparent 5px 10px)}
.lane .hz{position:absolute;left:0;top:50%;transform:translate(0,-50%) scaleX(-1);font-size:26px}
.lane .nm{position:absolute;left:44px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--muted)}
.reels{display:flex;justify-content:center;gap:10px;margin:8px 0}
.reel{width:70px;height:80px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:42px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.reel.spin{animation:spin .12s linear infinite}
@keyframes spin{50%{transform:translateY(4px)}}

.toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px;z-index:70;animation:fade .2s;white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.stats{gap:3px;padding-bottom:8px}.bar{height:12px}.nav .age .circle{width:62px;height:62px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="menu-btn" id="menuBtn" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="avatar" id="avatar">👶</div>
    <div class="who"><div class="nm" id="name">—</div><div class="oc" id="occ">—</div></div>
    <div class="bank"><div class="amt" id="bank">$0</div><div class="lb">Saldo bancario</div></div>
  </header>
  <main class="log" id="log" aria-live="polite"></main>
  <nav class="nav">
    <button class="b-occ" id="bOcc"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18"/></svg></span><span id="occLbl">Ocupación</span></button>
    <button class="b-ast" id="bAst"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg></span><span>Activos</span></button>
    <button class="age" id="bAge" aria-label="Cumplir un año"><span class="circle"><span>+</span></span><span>Edad</span></button>
    <button class="b-rel" id="bRel"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.9 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.5 3.4 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg></span><span>Relaciones</span></button>
    <button class="b-act" id="bAct"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg></span><span>Actividades</span></button>
  </nav>
  <section class="stats" id="stats"></section>
</div>
<script>
'use strict';
/* =====================================================================
   BitVida — simulador de vida
   ===================================================================== */

/* ---------------- Utilidades ---------------- */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickW(list) { const tot = list.reduce((s, x) => s + x[1], 0); let r = Math.random() * tot; for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; } return list[0][0]; }
function money(n) {
  const neg = n < 0; n = Math.round(Math.abs(n));
  return (neg ? '-$' : '$') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function shortMoney(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e9) return s + '$' + (a / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace('.0', '') + ' mil M';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.0', '') + 'M';
  return money(n);
}
const años = n => n === 1 ? '1 año' : `${n} años`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function statColor(v) {
  if (v < 20) return 'var(--red)';
  if (v < 40) return 'var(--orange)';
  if (v < 60) return 'var(--yellow)';

<script>

function save() { try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { } }

/* ---------------- Ayudantes de personaje ---------------- */
const gx = (m, f, p = c) => (p && p.gender === 'F' ? f : m);

const fullName = p => `${p.first} ${p.last}`;
const inc = (k, n = 1) => { c.counts[k] = (c.counts[k] || 0) + n; };
const yinc = (k, n = 1) => (c.yr[k] = (c.yr[k] || 0) + n);
const yget = k => c.yr[k] || 0;
const adult = () => c.age >= 18;

function stat(k, d) {
  if (!d) return;
  if (k === 'karma') { c.karma = clamp(c.karma + d); return; }
  if (k === 'fame') { c.fame = clamp(c.fame + d); return; }
  if (k === 'money') { c.money += d; return; }
  c.stats[k] = clamp(c.stats[k] + d);
  flashStat(k);
}
function eff(o) { for (const k in o) stat(k, Array.isArray(o[k]) ? rnd(o[k][0], o[k][1]) : o[k]); }
/* rendimiento decreciente: la n-ésima vez en el año rinde menos */
function dim(key, val) { const n = yinc(key); return Math.round(val / Math.max(1, n * 0.85)); }

function avatarOf(p) {
  if (p.type === 'pet') return (PETS[p.species] || PETS.perro).icon;
  if (p.alive === false && p !== c) return '🪦';
  const a = p.age, f = p.gender === 'F';
  if (a < 3) return '👶';
  if (a < 13) return f ? '👧' : '👦';
  if (a < 60) return f ? '👩' : '👨';
  return f ? '👵' : '👴';
}
const REL_LABEL = {
  parent: ['Padre', 'Madre'], sibling: ['Hermano', 'Hermana'], friend: ['Amigo', 'Amiga'], partner: ['Novio', 'Novia'],
  fiance: ['Prometido', 'Prometida'], spouse: ['Esposo', 'Esposa'], child: ['Hijo', 'Hija'], ex: ['Ex pareja', 'Ex pareja'],
  exspouse: ['Ex esposo', 'Ex esposa'], classmate: ['Compañero de clase', 'Compañera de clase'], coworker: ['Colega', 'Colega'],
  inmate: ['Recluso', 'Reclusa'], boss: ['Jefe', 'Jefa'], stepparent: ['Padrastro', 'Madrastra'], grand: ['Abuelo', 'Abuela']
};
function relLabel(p) {
  if (p.type === 'pet') return (PETS[p.species] || PETS.perro).n;
  const l = REL_LABEL[p.type] || ['Conocido', 'Conocida'];
  let s = p.gender === 'F' ? l[1] : l[0];
  if (p.alive === false && p.type === 'spouse') s = 'Difunt' + gx('o', 'a', p) + ' ' + s.toLowerCase();
  return s;
}
const my = p => `mi ${relLabel(p).toLowerCase()} ${p.first}`;

/* Título de trabajo en femenino (heurística ligera) */
const NOFEM = new Set(['junior', 'senior', 'Modelo', 'Supermodelo', 'Mayor', 'Peón', 'Cadete', 'Socio', 'Socio']);
function femTitle(t) {
  const w = t.split(' '); let stop = false;
  return w.map(x => {
    if (stop) return x;
    if (/^(de|del|en|y)$/.test(x)) { stop = true; return x; }
    if (NOFEM.has(x)) return x;
    if (x === 'Jefe' || x === 'jefe') return x.slice(0, 3) + 'a';
    if (/[a-záéíóú]o$/.test(x)) return x.slice(0, -1) + 'a';
    if (/or$/.test(x)) return x + 'a';
    return x;
  }).join(' ');
}
const jobTitle = (j, p = c) => (p.gender === 'F' ? femTitle(j.title) : j.title);

/* ---------------- Generación de personas ---------------- */
function makePerson(o = {}) {
  const lg = o.lang || (c ? lang() : 'es');
  const pool = NAMES[lg] || NAMES.es;
  const gender = o.gender || pick(['M', 'F']);
  const p = {
    id: uid(), type: o.type || 'friend', gender,
    first: o.first || pick(pool[gender]), last: o.last || pick(pool.L),
    age: o.age ?? rnd(18, 40), alive: true,
    rel: o.rel ?? rnd(40, 90), looks: o.looks ?? rnd(5, 100), smarts: o.smarts ?? rnd(5, 100),
    health: rnd(60, 100), money: o.money ?? 0, job: o.job || null, years: 0
  };
  if (p.age >= 18 && !p.job && o.type !== 'child') p.job = randomJobLabel(p);
  return p;
}
function randomJobLabel(p) {
  if (p.age >= 68) return gx('jubilado', 'jubilada', p);
  if (p.age < 23 && chance(0.5)) return gx('estudiante universitario', 'estudiante universitaria', p);
  const tier = pickW([['pobre', 3], ['media', 5], ['alta', 2], ['rica', 0.4]]);
  const j = pick(PARENT_JOBS[tier]);
  return p.gender === 'F' ? j[1] : j[0];
}
function makePet(species, o = {}) {
  const sp = PETS[species];
  return { id: uid(), type: 'pet', species, gender: pick(['M', 'F']), first: o.name || pick(PET_NAMES), last: '', age: o.age ?? rnd(0, 4), alive: true, rel: rnd(60, 95), health: rnd(70, 100), life: rnd(sp.life[0], sp.life[1]), years: 0 };
}

/* =====================================================================
   Bitácora
   ===================================================================== */
function log(text, cls = '') {
  if (!c) return;
  if (!c.log.length) c.log.push({ age: c.age, lines: [] });
  c.log[c.log.length - 1].lines.push(cls ? [text, cls] : text);
}
function say(text, o = {}) {
  log(text, o.cls || '');
  popup({ icon: o.icon, title: o.title || '', text, color: o.color, buttons: o.buttons });
}

/* =====================================================================
   Cola de ventanas emergentes
   ===================================================================== */
const Q = { open: false, items: [], collect: null, el: null };
function popup(o) {
  if (Q.collect) Q.collect.push(o); else Q.items.push(o);
  if (!Q.open && !Q.collect) nextPopup();
}
function runHandler(fn) {
  const prev = Q.collect; Q.collect = [];
  try { fn && fn(); }
  catch (e) { console.error(e); }
  finally {
    const got = Q.collect; Q.collect = prev;
    if (prev) prev.push(...got); else Q.items.unshift(...got);
  }
}
function nextPopup() {
  if (Q.open) return;
  const o = Q.items.shift();
  if (!o) { if (c && !c.alive && !$('.death')) showDeath(); return; }
  Q.open = true;
  const wrap = document.createElement('div');
  wrap.className = 'pop-wrap';
  const btns = (o.buttons && o.buttons.length ? o.buttons : [{ label: 'OK' }]);
  const color = o.color || (o.title ? 'var(--blue)' : 'var(--dark)');
  wrap.innerHTML = `<div class="pop" role="dialog" aria-modal="true">
    <div class="pop-h" style="--pc:${color}">${o.icon ? `<span class="pop-ic">${o.icon}</span>` : ''}${o.title ? `<h3>${esc(o.title)}</h3>` : ''}</div>
    <div class="pop-b">${o.html || `<p>${esc(o.text || '')}</p>`}
      ${o.input ? `<input id="popInput" type="${o.input.type || 'text'}" value="${esc(o.input.value || '')}" placeholder="${esc(o.input.placeholder || '')}" maxlength="${o.input.max || 24}" autocomplete="off">` : ''}
      <div class="pop-btns">${btns.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}" ${b.disabled ? 'disabled' : ''}>${esc(b.label)}</button>`).join('')}</div>
    </div></div>`;
  if (!o.title && !o.icon) wrap.querySelector('.pop-h').remove();
  wrap.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b || b.disabled) return;
    const def = btns[+b.dataset.i];
    const inp = wrap.querySelector('#popInput');
    const val = inp ? inp.value.trim() : undefined;
    wrap.remove(); Q.open = false; Q.el = null;
    runHandler(() => def.onClick && def.onClick(val));
    afterAction();
  });
  app.appendChild(wrap); Q.el = wrap;
  const inp = wrap.querySelector('#popInput');
  (inp || wrap.querySelector('button:not([disabled])'))?.focus();
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') wrap.querySelector('button[data-i]').click(); });
  if (o.onShow) o.onShow(wrap);
}
function act(fn) { runHandler(fn); afterAction(); }
function afterAction() { render(); refreshSheets(); save(); if (!Q.open) nextPopup(); }
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;

}

/* =====================================================================

const S = [];
function openSheet(build) {
  const el = document.createElement('div'); el.className = 'sheet';
  app.appendChild(el);
  const s = { build, el, scroll: 0 };
  S.push(s);
  drawSheet(s);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
}
function drawSheet(s) {
  const d = s.build();
  if (!d) { const i = S.indexOf(s); if (i >= 0) { S.splice(i, 1); s.el.remove(); } return; }
  const body = s.el.querySelector('.sh-b');
  const st = body ? body.scrollTop : 0;
  s.items = d.items || [];
  let html = `<div class="sh-h" style="--c:${d.color || 'var(--blue)'}"><button class="x" aria-label="${S.indexOf(s) > 0 ? 'Atrás' : 'Cerrar'}">${S.indexOf(s) > 0 ? '‹' : '✕'}</button><h2>${esc(d.title)}</h2><span class="sp"></span></div><div class="sh-b">`;
  let open = false;
  s.items.forEach((it, i) => {
    if (it.section !== undefined || it.html !== undefined) {
      if (open) { html += '</div>'; open = false; }
      if (it.section !== undefined) html += `<div class="sec">${esc(it.section)}</div>`;
      else html += it.html;
      return;
    }
    if (!open) { html += '<div class="list">'; open = true; }
    const bar = it.bar !== undefined ? `<div class="mb"><i style="width:${it.bar}%;background:${statColor(it.bar)}"></i></div>` : '';
    html += `<button class="row" data-i="${i}" ${it.disabled ? 'disabled' : ''}>
      <span class="ic">${it.icon || '•'}</span>
      <span class="tx"><div class="t">${esc(it.title)}</div>${it.sub ? `<div class="s">${esc(it.sub)}</div>` : ''}${bar}</span>
      ${it.right ? `<span class="r ${it.rightCls || ''}">${esc(it.right)}</span>` : ''}
      ${it.sheet || it.chev ? '<span class="ch">›</span>' : ''}</button>`;
  });
  if (open) html += '</div>';
  html += '</div>';
  s.el.innerHTML = html;
  s.el.querySelector('.sh-b').scrollTop = st;
  s.el.querySelector('.x').onclick = () => closeSheet(s);
  s.el.querySelector('.sh-b').onclick = e => {
    const b = e.target.closest('.row[data-i]');
    if (b && !b.disabled) {
      const it = s.items[+b.dataset.i];
      if (it.sheet) openSheet(it.sheet);
      else if (it.onClick) act(it.onClick);
      return;
    }
    const a = e.target.closest('[data-act]');
    if (a && s.acts && s.acts[a.dataset.act]) s.acts[a.dataset.act](a);
  };
  s.acts = d.acts;
  if (d.mount) d.mount(s.el);
}
function closeSheet(s) {
  s = s || S[S.length - 1]; if (!s) return;
  const i = S.indexOf(s); if (i < 0) return;
  S.splice(i, 1);
  if (s.onClose) s.onClose();
  s.el.classList.remove('in');
  setTimeout(() => s.el.remove(), 260);
}
function closeAllSheets() { while (S.length) { const s = S.pop(); if (s.onClose) s.onClose(); s.el.remove(); } }
function refreshSheets() { S.slice().forEach(s => { if (!s.static) drawSheet(s); }); }

/* =====================================================================
   Render principal
   ===================================================================== */
const STATS = [['happy', '😊', 'Felicidad'], ['health', '❤️', 'Salud'], ['smarts', '🧠', 'Inteligencia'], ['looks', '😎', 'Apariencia']];
const flashing = new Set();
function flashStat(k) { flashing.add(k); }
let lastLogSig = '';
function occupationLabel() {
  if (!c.alive) return 'Fallecid' + gx('o', 'a');
  if (c.prison) return `${gx('Recluso', 'Reclusa')} · ${countryOf(c.country).flag}`;
  const parts = [];
  if (c.job) parts.push(jobTitle(c.job));
  const e = c.edu;
  if (e.stage === 'primaria') parts.push('Estudiante de primaria');
  else if (e.stage === 'secundaria') parts.push('Estudiante de secundaria');
  else if (e.stage === 'universidad') parts.push(`Estudiante de ${e.major}`);
  else if (e.stage === 'posgrado') parts.push(`Estudiante de ${e.program}`);
  if (c.pt) parts.push(c.pt.n);
  if (!parts.length) {
    if (c.age < 3) parts.push(gx('Bebé', 'Bebé'));
    else if (c.age < 6) parts.push(gx('Niño', 'Niña'));
    else if (c.retired) parts.push(gx('Jubilado', 'Jubilada'));
    else parts.push(gx('Desempleado', 'Desempleada'));
  }
  return parts.join(' · ') + ' · ' + countryOf(c.country).flag;
}
function render() {
  if (!c) return;
  $('#avatar').textContent = avatarOf(c);
  $('#name').textContent = fullName(c);
  $('#occ').textContent = occupationLabel();
  const b = $('#bank'); b.textContent = shortMoney(c.money); b.classList.toggle('neg', c.money < 0);
  $('#occLbl').textContent = c.prison ? 'Prisión' : 'Ocupación';

  $('#stats').innerHTML = STATS.map(([k, e, l]) => {

    return `<div class="st ${flashing.has(k) ? 'flash' : ''}"><span class="lbl"><em>${e}</em>${l}</span><span class="bar"><i style="width:${v}%;background:${statColor(v)}"></i></span><span class="pct">${v}%</span></div>`;
  }).join('');
  flashing.clear();
  // bitácora (solo si cambió)
  const last = c.log[c.log.length - 1];
  const sig = c.id + ':' + c.log.length + ':' + (last ? last.lines.length : 0);
  if (sig !== lastLogSig) {
    lastLogSig = sig;
    const L = $('#log');
    const atBottom = L.scrollHeight - L.scrollTop - L.clientHeight < 80;
    const start = Math.max(0, c.log.length - 120);
    L.innerHTML = c.log.slice(start).map(y => `<div class="yr"><h4>Edad: ${años(y.age)}</h4>${y.lines.map(l => Array.isArray(l) ? `<p class="${l[1]}">${esc(l[0])}</p>` : `<p>${esc(l)}</p>`).join('')}</div>`).join('') + '<div class="log-end"></div>';
    if (atBottom || forceScroll) { L.scrollTop = L.scrollHeight; forceScroll = false; }
  }
}
let forceScroll = false;

/* =====================================================================
   Nueva vida
   ===================================================================== */
function createLife(o = {}) {
  const country = o.country ? countryOf(o.country) : pickW(COUNTRIES.map(k => [k, k.lang === 'es' ? 3 : 1]));
  const lg = country.lang;
  const gender = o.gender || pick(['M', 'F']);

  const first = o.first || pick(NAMES[lg][gender]);

  c.rels.push(mom, dad);

  for (let i = 0; i < sibs && mom.age - 18 > 1; i++) c.rels.push(makePerson({ type: 'sibling', age: rnd(1, Math.min(14, mom.age - 18)), last, lang: lg, rel: rnd(45, 95) }));
  c.log.push({ age: 0, lines: [] });
  const sx = gender === 'M' ? 'niño' : 'niña';

  log(`Mi madre es ${fullName(mom)}, ${mom.job} (${años(mom.age)}).`);
  log(`Mi padre es ${fullName(dad)}, ${dad.job} (${años(dad.age)}).`);
  c.rels.filter(p => p.type === 'sibling').forEach(s => log(`Tengo ${gx('un hermano mayor', 'una hermana mayor', s)} llamad${gx('o', 'a', s)} ${s.first} (${años(s.age)}).`));
  const famTxt = { pobre: 'Mi familia es pobre.', media: 'Mi familia es de clase media.', alta: 'Mi familia es acomodada.', rica: '¡Nací en una familia rica!' }[fam];
  log(famTxt, fam === 'rica' ? 'gold' : '');
  if (chance(0.25)) { const pet = makePet(pick(['perro', 'gato', 'perro', 'pez', 'conejo'])); c.rels.push(pet); log(`Mi familia tiene ${gx('un', 'una', pet)} ${PETS[pet.species].n.toLowerCase()} llamad${gx('o', 'a', pet)} ${pet.first}.`); }

}

/* =====================================================================
   Paso del tiempo
   ===================================================================== */
function deathProb(a) {
  if (a < 1) return 0.002;
  if (a < 40) return 0.0008;
  if (a < 60) return 0.003 + (a - 40) * 0.0007;
  if (a < 80) return 0.017 + (a - 60) * 0.0045;
  if (a < 95) return 0.107 + (a - 80) * 0.013;
  return Math.min(0.95, 0.3 + (a - 95) * 0.06);
}

function ageUp() {
  if (!c || !c.alive) return;
  c.age++;
  c.yr = {}; c.listings = {};
  c.log.push({ age: c.age, lines: [] });
  forceScroll = true;

  if (c.pregnant) birthBaby();
  // deriva natural de estadísticas
  stat('happy', rnd(-4, 3) + (c.stats.happy < 25 ? 3 : 0));
  if (c.age > 48) stat('health', -rnd(0, Math.ceil((c.age - 44) / 10)));
  else stat('health', rnd(-1, 3) + (c.stats.health < 60 ? 1 : 0));
  if (c.age > 35) stat('looks', -rnd(0, c.age > 60 ? 3 : 2));
  else if (c.age >= 12 && c.age <= 19) stat('looks', rnd(-3, 4));
  if (c.age < 18) stat('smarts', rnd(0, 1));
  if (c.age > 75) stat('smarts', -rnd(0, 2));

  milestones();
  agePeople();
  if (c.prison) prisonYear();
  else { schoolYear(); jobYear(); }
  finances();
  assetsYear();
  socialYear();
  diseasesYear();
  if (!c.prison) { lawYear(); randomEvents(); } else prisonEvents();
  deathCheck();
}

function milestones() {
  const a = c.age;
  const M = {
    1: () => log('Di mis primeros pasos. 👣'),
    2: () => log(`Dije mi primera palabra: «${pick(['mamá', 'papá', 'agua', 'no', 'perro', 'galleta', 'teta', 'pelota'])}».`),
    3: () => log('Aprendí a ir al baño solo' + gx('', 'a') + '.'),
    4: () => log(pick(['Aprendí a andar en triciclo.', 'Aprendí los colores.', 'Me encanta dibujar en las paredes.', 'Aprendí a contar hasta diez.'])),
    7: () => { log('Se me cayó mi primer diente. 🦷'); const m = rnd(1, 10); c.money += m; log(`El ratón Pérez me dejó ${money(m)}.`, 'good'); },
    13: () => log('¡Ya soy adolescente!', 'em'),
    16: () => log('Ya tengo edad para sacar la licencia de conducir.'),
    18: () => log('¡Ya soy mayor de edad! 🎉', 'em'),
    30: () => log('Cumplí 30. Ya no soy un' + gx('', 'a') + ' jovencit' + gx('o', 'a') + '.'),
    50: () => log('Medio siglo de vida. 🎂'),
    65: () => log('Ya tengo edad de jubilación.'),
    100: () => log('¡CUMPLÍ 100 AÑOS! 🎂🎉', 'gold')
  };
  if (M[a]) M[a]();
  if (a >= 3 && a <= 17 && chance(0.12)) {
    const par = c.rels.find(p => p.type === 'parent' && p.alive && p.rel > 50);
    if (par) { const m = rnd(...ALLOWANCE[c.family]); c.money += m; log(`${cap(my(par))} me dio ${money(m)} de mesada.`, 'good'); }
  }
}

function agePeople() {
  for (const p of c.rels) {
    if (!p.alive) continue;
    p.age++; p.years = (p.years || 0) + 1;
    if (p.type === 'pet') {
      if (p.age > p.life || chance(0.02)) {
        p.alive = false; p.deathAge = p.age;
        log(`${cap(my(p))} murió. 🐾`, 'bad'); stat('happy', -rnd(6, 15));
      } else p.rel = clamp(p.rel - rnd(0, 4));
      continue;
    }
    // la relación se enfría con el tiempo
    const decay = p.type === 'parent' ? rnd(0, 3) : p.type === 'child' ? rnd(0, 3) : rnd(0, 6);
    p.rel = clamp(p.rel - decay);
    if (p.age === 18 && p.type === 'child') { p.job = randomJobLabel(p); log(`${cap(my(p))} ya es mayor de edad.`); }
    if (p.age >= 18 && !p.job) p.job = randomJobLabel(p);
    // muerte
    let dp = deathProb(p.age) * (p.type === 'child' || p.type === 'sibling' ? 0.6 : 1);
    if (chance(dp)) { personDies(p, p.age > 70 ? pick(['de vejez', 'de un paro cardíaco', 'de neumonía', 'de un derrame cerebral', 'mientras dormía']) : pick(['en un accidente de tránsito', 'de cáncer', 'de un infarto', 'en un accidente'])); continue; }
    // rupturas
    if (p.type === 'partner' && p.rel < 22 && chance(0.45)) { breakUp(p, true); continue; }
    if (p.type === 'fiance' && p.rel < 18 && chance(0.4)) { breakUp(p, true); continue; }
    if (p.type === 'spouse' && p.rel < 14 && chance(0.35)) { divorce(p, true); continue; }
    if (p.type === 'friend' && p.rel < 12 && chance(0.4)) { removeRel(p); log(`${p.first} ya no quiere ser ${gx('mi amigo', 'mi amiga', p)}.`, 'bad'); continue; }
  }
  // hermanos que nacen
  const mom = c.rels.find(p => p.type === 'parent' && p.gender === 'F' && p.alive);
  const dad = c.rels.find(p => p.type === 'parent' && p.gender === 'M' && p.alive);
  if (mom && dad && mom.age < 42 && c.age < 12 && chance(0.06)) {
    const s = makePerson({ type: 'sibling', age: 0, last: c.last, rel: rnd(60, 100) });
    c.rels.push(s);
    log(`¡Mi madre dio a luz a ${gx('mi hermanito', 'mi hermanita', s)} ${s.first}! 👶`, 'good');
    stat('happy', rnd(-2, 5));
  }
  // compañeros
  for (const p of [...c.classmates, ...c.coworkers, ...c.inmates]) p.age++;
}

function personDies(p, how) {
  p.alive = false; p.deathAge = p.age; p.deathHow = how;
  const lbl = my(p);
  log(`${cap(lbl)} murió ${how} a los ${años(p.age)}.`, 'bad');
  const hit = { parent: 25, spouse: 35, child: 40, sibling: 18, partner: 25, fiance: 28, friend: 10 }[p.type] || 4;
  stat('happy', -Math.round(hit * (0.4 + p.rel / 160)));
  if (p.type === 'parent' && p.money > 0 && p.rel >= 35 && chance(0.7)) {
    const alive = c.rels.filter(x => x.type === 'parent' && x.alive).length;
    const sibs = c.rels.filter(x => x.type === 'sibling' && x.alive).length;
    const share = alive ? 0.15 : 1 / (sibs + 1);
    const amt = Math.round(p.money * share * rnd(50, 100) / 100);
    if (amt > 0) { c.money += amt; log(`Heredé ${money(amt)} de ${lbl}.`, 'gold'); }
  }
  if ((p.type === 'spouse' || p.type === 'partner' || p.type === 'fiance') && p.money > 0) { c.money += p.money; log(`Heredé ${money(p.money)} de ${lbl}.`, 'gold'); }
  if (p.type === 'partner' || p.type === 'fiance') removeRel(p);
  if (p.type === 'friend') removeRel(p);
  popup({ icon: '🪦', title: 'Fallecimiento', color: 'var(--dark)', text: `${cap(lbl)} murió ${how}. Tenía ${años(p.age)}.`, buttons: [{ label: 'Descansa en paz' }] });
}
function removeRel(p) { c.rels = c.rels.filter(x => x !== p); }

/* ---------------- Muerte del personaje ---------------- */
function worstDisease() {
  const d = c.diseases.slice().sort((a, b) => b.sev[1] - a.sev[1])[0];
  return d && d.sev[1] > 8 ? d : null;
}
function deathCheck() {
  if (!c.alive) return;
  c.karma = clamp(c.karma + Math.round((50 - c.karma) / 30));
  if (c.stats.health <= 0) {
    const d = worstDisease();
    die(d ? `por complicaciones de ${d.n.toLowerCase()}` : pick(['por un fallo multiorgánico', 'por problemas de salud', 'de un paro cardíaco']));
    return;
  }
  let p = deathProb(c.age) * (0.35 + (100 - c.stats.health) / 55);
  if (c.age < 45) p *= 0.4;
  if (chance(p)) {
    let cause;
    if (worstDisease() && chance(0.6)) cause = `por complicaciones de ${worstDisease().n.toLowerCase()}`;
    else if (c.age >= 75) cause = pick(['de vejez', 'por causas naturales', 'de un paro cardíaco', 'de un derrame cerebral', 'mientras dormía']);
    else cause = pick(['en un accidente de tránsito', 'de un paro cardíaco', 'de un aneurisma', 'en un accidente doméstico', 'de un infarto fulminante']);
    die(cause);
  }
}
function die(cause) {
  if (!c.alive) return;
  c.alive = false; c.cause = cause;
  // los eventos pendientes de este año ya no importan
  Q.items.length = 0; if (Q.collect) Q.collect.length = 0;
  log(`Morí ${cause} a los ${años(c.age)}.`, 'bad');
  closeAllSheets();
}

/* ---------------- Patrimonio ---------------- */
function netWorth() {
  return c.money + c.assets.reduce((s, a) => s + assetValue(a), 0) - c.loans.reduce((s, l) => s + l.balance, 0);
}
function assetValue(a) { return Math.round(a.value * (a.kind === 'house' || a.kind === 'car' ? (0.55 + a.cond / 220) : 1)); }

function finances() {
  for (const L of c.loans) {
    const pay = Math.min(L.payment, L.balance);
    c.money -= pay; L.balance -= pay;
    if (L.balance <= 0) log(`¡Terminé de pagar ${L.name.toLowerCase()}!`, 'good');
  }
  c.loans = c.loans.filter(l => l.balance > 0);
  if (c.money < -5000 && chance(0.4)) { log('Los cobradores me están persiguiendo por mis deudas.', 'bad'); stat('happy', -rnd(3, 8)); }
  if (c.money > 0 && c.age >= 18) c.money += Math.round(c.money * 0.01); // intereses del banco
}
function assetsYear() {
  for (const a of c.assets) {
    if (a.kind === 'house') {
      a.value = Math.round(a.value * (1 + rnd(-3, 6) / 100));
      a.cond = clamp(a.cond - rnd(0, 4));
      if (a.rented) { const r = Math.round(a.value * 0.045 * (0.5 + a.cond / 200)); c.money += r; log(`Cobré ${money(r)} de alquiler de mi ${a.name.toLowerCase()}.`, 'good'); }
    } else if (a.kind === 'car') {
      a.value = Math.round(a.value * (1 - rnd(7, 14) / 100));
      a.cond = clamp(a.cond - rnd(3, 10));
    } else if (a.kind === 'lux') {
      a.value = Math.round(a.value * (1 - rnd(0, 5) / 100));
    }
  }
}
function socialYear() {
  const s = c.social;
  if (s.followers > 0) {
    s.followers = Math.max(0, Math.round(s.followers * (yget('posts') ? 1 : rnd(80, 98) / 100)));
    if (s.followers >= 10000 && c.age >= 13) {
      const inc2 = Math.round(s.followers * (s.verified ? 0.06 : 0.03));
      c.money += inc2; log(`Gané ${money(inc2)} con patrocinios en redes sociales.`, 'good');
    }
    c.fame = clamp(Math.round(Math.log10(Math.max(1, s.followers)) * 14) - 10, c.fame > 0 ? c.fame - 3 : 0, 100);
  }
}
function diseasesYear() {
  // de niño, tus padres te llevan al médico
  if (c.age < 18 && c.diseases.length && parentsAlive().length) {
    for (const d of c.diseases.slice()) if (chance(d.cure * 0.75)) { c.diseases = c.diseases.filter(x => x !== d); log(`Mis padres me llevaron al médico y me curé de ${d.n.toLowerCase()}.`, 'good'); }
  }
  for (const d of c.diseases) {
    const sevr = d.sev[1] > 12;
    stat('health', -(sevr ? Math.round(rnd(d.sev[0], d.sev[1]) / 2) : rnd(0, Math.ceil(d.sev[1] / 3))));
    if (d.happy) stat('happy', Math.round(d.happy / 2));
    if (d.smarts) stat('smarts', Math.round(d.smarts / 2));
    if (d.looks) stat('looks', Math.round(d.looks / 2));
  }
  const healed = c.diseases.filter(d => (d.cure >= 0.85 && chance(0.5)) || (d.cure >= 0.5 && chance(0.15)));
  for (const d of healed) log(`Me recuperé de ${d.n.toLowerCase()} por mi cuenta.`, 'good');
  c.diseases = c.diseases.filter(d => !healed.includes(d));
  const p = 0.035 + c.age / 2000 + (100 - c.stats.health) / 1200;
  if (chance(p)) catchDisease();
}
function catchDisease(std) {
  const pool = DISEASES.filter(d => (std ? d.std : !d.std) && c.age >= (d.min || 0) && c.age <= (d.max || 200) && !c.diseases.some(x => x.n === d.n));
  if (!pool.length) return;
  // las graves son menos frecuentes
  const d = pickW(pool.map(x => [x, x.sev[1] > 15 ? 1 : x.sev[1] > 9 ? 2.2 : 4]));
  c.diseases.push({ ...d });
  if (d.happy) stat('happy', d.happy);
  log(`Me diagnosticaron ${d.n.toLowerCase()}.`, 'bad');
  popup({ icon: '🤒', title: 'Diagnóstico', color: 'var(--red)', text: `No me he sentido bien. El médico me diagnosticó ${d.n.toLowerCase()}.${c.age < 18 ? '' : ' Debería ir al médico.'}` });
}

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const hasHS = () => c.edu.degrees.some(d => d.type === 'secundaria' || d.type === 'ged');
const hasDeg = majors => c.edu.degrees.some(d => d.type === 'uni' && (!majors || majors.includes(d.major)));

const inSchool = () => ['primaria', 'secundaria', 'universidad', 'posgrado'].includes(c.edu.stage);

}
function makeClassmates() {
  c.classmates = Array.from({ length: rnd(4, 6) }, () => makePerson({ type: 'classmate', age: c.age + rnd(-1, 1), rel: rnd(20, 60) }));
}
function enroll(stage, extra = {}) {
  const e = c.edu;
  e.stage = stage; e.years = 0;
  if (stage === 'primaria') { e.school = 'Escuela ' + pick(SCHOOLS.primaria); e.total = 6; e.grades = clamp(c.stats.smarts + rnd(-15, 15)); log(`Empecé la escuela primaria en ${e.school}. 🎒`, 'em'); }

function payTuition(total, label, then) {

function takeLoan(name, amount, years, assetId) {
  const rate = name.startsWith('Hipoteca') ? 0.055 : 0.05;

  c.loans.push({ id: uid(), name, balance: Math.round(payment * years), payment, assetId });
  log(`Tomé ${name.toLowerCase()} de ${money(amount)}. Pagaré ${money(payment)} al año.`);
}
function applyUni(major) {
  const g = (c.edu.degrees.find(d => d.type === 'secundaria') || {}).grades ?? 50;
  const score = (g + c.stats.smarts) / 2 + rnd(-10, 15);
  if (c.edu.degrees.some(d => d.type === 'ged')) { /* diploma de adultos: igual */ }
  if (score < 35) { say(`La universidad rechazó mi solicitud para estudiar ${major}. 😞`, { icon: '✉️', title: 'Rechazado', color: 'var(--red)', cls: 'bad' }); return; }

function applyGrad(program) {

  const best = Math.max(...uni.map(d => d.grades || 50));
  if ((best + c.stats.smarts) / 2 + rnd(-10, 10) < G2.min) { say(`Me rechazaron en la escuela de ${program}.`, { title: 'Rechazado', icon: '✉️', color: 'var(--red)', cls: 'bad' }); return; }
  popup({ icon: G2.icon, title: '¡Aceptado!', color: 'var(--good)', text: `¡Me aceptaron en ${program}!`, buttons: [{ label: 'Continuar', onClick: () => payTuition(G2.cost, program, () => { enroll('posgrado', { program }); closeAllSheets(); }) }] });

const TAX = 0.22;
function reqText(car) {
  const r = car.req;
  if (!r) return car.mil ? 'Edad 18 a 35' : 'Sin requisitos';
  if (r === 'hs') return 'Requiere secundaria';
  if (r === 'lic') return 'Requiere licencia de conducir';
  if (r.startsWith('looks')) return 'Requiere buena apariencia';
  if (r.startsWith('deg:')) return 'Título en ' + r.slice(4).split('|').slice(0, 3).join(', ') + (r.split('|').length > 3 ? '…' : '');
  if (r.startsWith('grad:')) return 'Requiere ' + r.slice(5);
  return '';
}
function meetsReq(car) {
  const r = car.req;
  if (car.mil) return c.age >= 18 && c.age <= 35;
  if (!r) return true;
  if (r === 'hs') return hasHS();
  if (r === 'lic') return !!c.licenses.conducir;
  if (r.startsWith('looks:')) return c.stats.looks >= +r.slice(6);
  if (r.startsWith('deg:')) return hasDeg(r.slice(4).split('|'));
  if (r.startsWith('grad:')) return hasGrad(r.slice(5)) && (!car.min || c.stats.smarts >= car.min);
  return true;
}
const INTERVIEW = [
  ['¿Por qué quieres trabajar con nosotros?', [['Admiro mucho esta empresa', 12], ['Busco crecer profesionalmente', 10], ['Necesito el dinero', -2], ['Mi mamá me obligó', -15]]],
  ['¿Cuál es tu mayor debilidad?', [['Soy demasiado perfeccionista', 6], ['A veces me cuesta delegar', 9], ['El chocolate', -4], ['Llego tarde casi siempre', -18]]],
  ['¿Dónde te ves en cinco años?', [['Liderando un equipo aquí', 12], ['Aprendiendo cada día', 8], ['En una playa, jubilado', -10], ['En su puesto', -3]]],
  ['¿Cómo manejas el estrés?', [['Me organizo y priorizo', 12], ['Hago ejercicio', 7], ['Grito en el baño', -10], ['No me estreso nunca', 0]]],
  ['¿Por qué deberíamos contratarte?', [['Soy trabajador y aprendo rápido', 12], ['Tengo la experiencia justa', 8], ['Porque sí', -12], ['Nadie más se presentó', -6]]],
  ['¿Qué haces en tu tiempo libre?', [['Leo y tomo cursos', 10], ['Hago deporte', 6], ['Duermo todo el día', -10], ['Veo series', 0]]]
];
function applyJob(car) {
  if (c.job && c.job.id === car.id) { say('Ya trabajas aquí.'); return; }
  if (!meetsReq(car)) {
    say(`Mi solicitud para ${car.levels[0].toLowerCase()} fue rechazada. ${reqText(car)}.`, { icon: '📄', title: 'Rechazado', color: 'var(--red)', cls: 'bad' }); return;
  }
  const q = pick(INTERVIEW);
  const comp = pick(car.comps);
  popup({
    icon: car.icon, title: 'Entrevista de trabajo', color: 'var(--occ)',
    text: `Entrevista para ${car.levels[0].toLowerCase()} en ${comp}.\n\n«${q[0]}»`,
    buttons: shuffle(q[1].slice()).map(([ans, pts]) => ({ label: ans, onClick: () => {
      let p = 0.45 + pts / 100 + (c.stats.smarts - 50) / 260 + (c.stats.looks - 50) / 320 - (c.record.length ? 0.25 : 0) + (car.mil ? 0.3 : 0);
      if (c.age >= 60) p -= 0.15;
      if (chance(p)) hire(car, comp);

  });
}
function hire(car, comp) {
  if (c.job) quitJob(true);
  c.job = { id: car.id, title: car.levels[0], company: comp, level: 0, salary: Math.round(car.sal * rnd(92, 108) / 100), perf: rnd(45, 65), years: 0, lvlYears: 0 };

  c.boss = makePerson({ type: 'boss', age: clamp(c.age + rnd(3, 25), 25, 72), rel: rnd(40, 60) });
  log(`¡Me contrataron como ${jobTitle(c.job).toLowerCase()} en ${comp}! Salario: ${money(c.job.salary)}/año.`, 'good');
  stat('happy', 8);
  closeAllSheets();
  popup({ icon: car.icon, title: '¡Contratad' + gx('o', 'a') + '!', color: 'var(--good)', text: `Ahora eres ${jobTitle(c.job).toLowerCase()} en ${comp}. Tu salario es ${money(c.job.salary)} al año.` });
}
function quitJob(silent) {

}
function retire() {
  const base = c.job ? c.job.salary : (c.lastSalary || 0);
  const yrs = c.job ? c.job.years : (c.lastJobYears || 0);
  c.pension = Math.round(base * Math.min(0.6, 0.15 + yrs * 0.015));
  log(`Me jubilé${c.job ? ' de ' + c.job.company : ''}. Mi pensión será de ${money(c.pension)} al año. 🏖️`, 'good');

}
function jobYear() {
  const j = c.job;
  if (j) {
    const car = CAREER[j.id];
    j.years++; j.lvlYears++;
    j.perf = clamp(j.perf + rnd(-8, 6) + Math.round((c.stats.smarts - 50) / 30) + Math.round((50 - j.perf) / 12));

    } else if (j.perf < 18 && chance(0.45)) {

  if (c.pt) {

    if (c.age >= 30 && chance(0.1)) { log(`Dejé mi trabajo de medio tiempo como ${c.pt.n.toLowerCase()}.`); c.pt = null; }

function militaryDeployment() {

const PRISONS = ['Penitenciaría Central', 'Cárcel La Roca', 'Prisión Estatal del Norte', 'Centro Penitenciario El Valle', 'Penal de Máxima Seguridad'];
function arrest(crime, minY, maxY) {
  closeAllSheets();
  inc('arrests');
  if (c.age < 14) {
    log(`Me atraparon por ${crime}. Mis padres se enteraron y me castigaron.`, 'bad');
    for (const p of c.rels.filter(p => p.type === 'parent' && p.alive)) p.rel = clamp(p.rel - rnd(10, 20));
    popup({ icon: '👮', title: '¡Te atraparon!', color: 'var(--red)', text: `La policía me atrapó por ${crime}. Como soy menor, me llevaron a casa y mis padres me castigaron.` });
    return;
  }
  log(`¡Me arrestaron por ${crime}! 🚓`, 'bad');
  stat('happy', -10);
  const minor = c.age < 18;
  popup({
    icon: '🚓', title: '¡Arrestad' + gx('o', 'a') + '!', color: 'var(--red)',
    text: `Me arrestaron por ${crime}. ${minor ? 'Por ser menor, iré a un tribunal juvenil.' : 'Voy a ir a juicio.'} ¿Qué abogado quieres?`,
    buttons: [
      { label: 'Defensor público (gratis)', onClick: () => trial(crime, minY, maxY, 0.22) },
      { label: `Abogado privado (${money(8000)})`, disabled: c.money < 8000, onClick: () => { c.money -= 8000; trial(crime, minY, maxY, 0.42); } },
      { label: `Abogado de élite (${money(75000)})`, disabled: c.money < 75000, onClick: () => { c.money -= 75000; trial(crime, minY, maxY, 0.68); } },
      { label: 'Declararme culpable', cls: 'ghost', onClick: () => sentence(crime, Math.max(minY > 0 ? 1 : 0, Math.floor(minY * 0.7)), Math.max(1, Math.floor(maxY * 0.6))) }
    ]
  });
}
function trial(crime, minY, maxY, p) {
  p += (c.karma - 50) / 300 + (c.record.length ? -0.08 : 0.05);
  if (chance(p)) {
    log(`El juez me declaró inocente de ${crime}. ⚖️`, 'good');
    popup({ icon: '⚖️', title: '¡Inocente!', color: 'var(--good)', text: `El jurado me declaró NO CULPABLE de ${crime}. ¡Soy libre!` });
  } else sentence(crime, minY, maxY);
}
function sentence(crime, minY, maxY) {
  let years = rnd(minY, maxY);
  if (c.age < 18) years = Math.ceil(years / 3);
  if (years <= 0) {
    const fine = rnd(300, 2500);
    c.money -= fine; log(`Me declararon culpable de ${crime} y pagué una multa de ${money(fine)}.`, 'bad');
    popup({ icon: '🧾', title: 'Culpable', color: 'var(--red)', text: `Me declararon culpable de ${crime}. Solo tuve que pagar una multa de ${money(fine)}.` });
    c.record.push({ crime, years: 0, age: c.age });
    return;
  }
  toPrison(crime, years);
}
function toPrison(crime, years) {
  c.record.push({ crime, years, age: c.age });
  if (c.job) { log(`Perdí mi trabajo en ${c.job.company}.`, 'bad'); c.job = null; c.coworkers = []; }
  c.pt = null;
  if (inSchool()) { log('Me expulsaron de la escuela.', 'bad'); c.edu.stage = 'none'; c.classmates = []; }
  const juvie = c.age < 18;
  c.prison = { name: juvie ? 'Centro de Detención Juvenil' : pick(PRISONS), years, served: 0, crime, escaped: 0 };
  c.inmates = Array.from({ length: 4 }, () => makePerson({ type: 'inmate', gender: c.gender, age: juvie ? rnd(14, 17) : rnd(19, 60), rel: rnd(10, 40) }));
  for (const p of c.rels) if (p.type === 'partner' && p.alive && chance(0.5)) { breakUp(p, true); }
  log(`Me sentenciaron a ${años(years)} en ${c.prison.name} por ${crime}. ⛓️`, 'bad');
  stat('happy', -20);
  popup({ icon: '⛓️', title: 'Sentencia', color: 'var(--dark)', text: `Culpable de ${crime}. Me sentenciaron a ${años(years)} en ${c.prison.name}.` });
}
function prisonYear() {
  const P = c.prison;
  P.served++; inc('prisonYears');
  stat('health', -rnd(0, 4)); stat('happy', -rnd(1, 6)); stat('looks', -rnd(0, 2));
  if (P.served >= P.years) {
    log(`¡Salí de prisión después de cumplir mi condena de ${años(P.years)}! 🔓`, 'good');
    c.prison = null; c.inmates = []; stat('happy', 15);
    popup({ icon: '🔓', title: '¡Libertad!', color: 'var(--good)', text: `Cumpliste tu condena de ${años(P.years)}. ¡Eres libre!` });
  }
}
function lawYear() {
  if (c.wanted > 0 && chance(0.12)) {
    const w = c.wanted; c.wanted = 0;
    log('La policía reabrió un caso viejo y encontró pruebas en mi contra.', 'bad');
    arrest(w >= 2 ? 'asesinato' : 'un crimen del pasado', w >= 2 ? 20 : 3, w >= 2 ? 60 : 10);
  }
  if (c.flags.fugitive && chance(0.2)) {
    c.flags.fugitive = false;
    log('¡Me encontraron! Me llevaron de vuelta a prisión.', 'bad');
    toPrison('fuga de prisión', rnd(4, 10));
  }
}
function prisonEvents() {
  if (!c.prison || !chance(0.45)) return;
  const inm = pick(c.inmates) || makePerson({ type: 'inmate', gender: c.gender });
  const evs = [
    () => popup({ icon: '😠', title: 'Provocación', color: 'var(--dark)', text: `${fullName(inm)}, ${gx('un recluso', 'una reclusa', inm)}, me empujó en el comedor.`, buttons: [
      { label: 'Pelear', cls: 'red', onClick: () => { if (chance(0.5 + (c.stats.health - 50) / 200)) { say(`Le di una paliza a ${inm.first}. Ahora me respetan más.`, { cls: 'good' }); stat('happy', 4); } else { stat('health', -rnd(8, 18)); say(`${inm.first} me dio una paliza. 🤕`, { cls: 'bad' }); } } },
      { label: 'Ignorar', cls: 'ghost', onClick: () => log(`Ignoré a ${inm.first}.`) },
      { label: 'Avisar a los guardias', cls: 'ghost', onClick: () => { log(`Le conté a los guardias sobre ${inm.first}.`); if (chance(0.4)) { stat('health', -rnd(5, 12)); say(`${inm.first} se enteró de que fui ${gx('un soplón', 'una soplona')} y me golpeó.`, { cls: 'bad' }); } } }
    ] }),
    () => popup({ icon: '🔪', title: 'Pandilla', color: 'var(--dark)', text: 'Una pandilla de la prisión me invitó a unirme a ellos.', buttons: [
      { label: 'Unirme', onClick: () => { c.flags.gang = true; stat('karma', -5); log('Me uní a una pandilla de la prisión.'); } },
      { label: 'Rechazar', cls: 'ghost', onClick: () => { log('Rechacé unirme a la pandilla.'); if (chance(0.3)) { stat('health', -rnd(5, 15)); log('La pandilla me dio una golpiza por rechazarlos.', 'bad'); } } }
    ] }),
    () => { log(pick(['La comida de la prisión hoy fue especialmente horrible.', 'Mi compañero de celda ronca muchísimo.', 'Vi un ratón en mi celda.', 'Hubo un cierre de emergencia toda la semana.', 'Un guardia me trató con amabilidad.'])); }
  ];
  pick(evs)();
}

   Bebés y relaciones
   ===================================================================== */
function birthBaby() {
  const other = c.rels.find(p => p.id === c.pregnant.with);
  c.pregnant = null;
  const g = pick(['M', 'F']);
  const baby = makePerson({ type: 'child', gender: g, age: 0, last: c.gender === 'M' || !other ? c.last : (other.gender === 'M' ? other.last : c.last), rel: 100 });
  baby.otherParent = other ? other.id : null;
  c.rels.push(baby); inc('kids');
  stat('happy', rnd(8, 15));
  const who = c.gender === 'F' || !other ? 'Di a luz' : `${cap(my(other))} dio a luz`;
  log(`${who} a ${g === 'M' ? 'un niño' : 'una niña'}: ${baby.first}. 👶`, 'good');
  popup({
    icon: '👶', title: g === 'M' ? '¡Es un niño!' : '¡Es una niña!', color: 'var(--rel)',
    text: `¡Nació tu bebé! ¿Cómo quieres llamar${g === 'M' ? 'lo' : 'la'}?`,
    input: { value: baby.first, placeholder: 'Nombre' },
    buttons: [{ label: 'Elegir nombre', onClick: v => { if (v && v !== baby.first) { const old = baby.first; baby.first = v.slice(0, 24); log(`Al final ${g === 'M' ? 'lo' : 'la'} llamamos ${baby.first} en vez de ${old}.`); } } }]
  });
}
function tryForBaby(p) {
  const femAge = c.gender === 'F' ? c.age : p.gender === 'F' ? p.age : null;
  if (c.gender === p.gender) { say('Biológicamente no pueden tener un bebé juntos. Pueden adoptar en Actividades.', { title: 'Bebé' }); return; }
  if (c.pregnant) { say(c.gender === 'F' ? '¡Ya estás embarazada!' : `${p.first} ya está embarazada.`); return; }
  if (yget('baby_' + p.id) >= 2) { say('Ya lo intentaron mucho este año. 😅'); return; }
  yinc('baby_' + p.id);
  p.rel = clamp(p.rel + rnd(2, 6)); stat('happy', rnd(2, 5));
  const fert = femAge > 50 ? 0 : femAge > 44 ? 0.06 : femAge > 38 ? 0.2 : 0.45;
  if (p.rel < 30 && chance(0.6)) { p.rel = clamp(p.rel - 5); say(`${p.first} no quiso intentar tener un bebé conmigo.`, { cls: 'bad' }); return; }
  if (chance(fert)) {
    c.pregnant = { with: p.id };
    say(c.gender === 'F' ? '¡Estoy embarazada! 🤰 El bebé nacerá el próximo año.' : `¡${p.first} está embarazada! 🤰 El bebé nacerá el próximo año.`, { icon: '🤰', title: '¡Embarazo!', color: 'var(--rel)', cls: 'good' });
  } else say(`Intentamos tener un bebé con ${p.first}, pero no funcionó esta vez.`, { icon: '🛏️' });
}
function breakUp(p, byThem) {
  const wasSp = p.type === 'fiance';
  p.type = 'ex'; p.rel = rnd(5, 35);
  if (byThem) {
    log(`${p.first} terminó conmigo. 💔`, 'bad'); stat('happy', -rnd(8, 16));
    popup({ icon: '💔', title: 'Ruptura', color: 'var(--rel)', text: `${p.first} ${wasSp ? 'canceló nuestro compromiso y ' : ''}terminó conmigo.` });
  } else { log(`Terminé con ${p.first}.`, 'bad'); stat('happy', -rnd(2, 8)); }
}
function divorce(p, byThem) {
  p.type = 'exspouse'; p.rel = rnd(0, 30);
  let lost = 0;
  if (c.money > 0 && !c.flags.prenup) { lost = Math.round(c.money * rnd(30, 50) / 100); c.money -= lost; }
  c.flags.prenup = false;
  const txt = byThem ? `${p.first} me pidió el divorcio. 💔` : `Me divorcié de ${p.first}.`;
  log(txt + (lost ? ` Perdí ${money(lost)} en el divorcio.` : ''), 'bad');
  stat('happy', -rnd(10, 20)); inc('divorces');
  popup({ icon: '💔', title: 'Divorcio', color: 'var(--rel)', text: txt + (lost ? ` En el acuerdo perdí ${money(lost)}.` : '') });
}
const currentPartner = () => c.rels.find(p => ['partner', 'fiance', 'spouse'].includes(p.type) && p.alive);
function startRomance(p) {
  const cur = currentPartner();
  p.type = 'partner'; p.rel = clamp(p.rel + rnd(15, 30), 50, 100); p.years = 0;
  if (!c.rels.includes(p)) c.rels.push(p);
  c.classmates = c.classmates.filter(x => x !== p); c.coworkers = c.coworkers.filter(x => x !== p);
  inc('partners');
  log(`Empecé a salir con ${fullName(p)}. 💕`, 'good');
  stat('happy', rnd(5, 10));
  if (cur) {
    stat('karma', -6);
    if (chance(0.4)) {
      log(`${cur.first} descubrió que le estaba siendo infiel. 😱`, 'bad');
      if (cur.type === 'spouse') divorce(cur, true); else breakUp(cur, true);
    }
  }
}

const FLAVOR = {
  baby: ['Gateé por toda la casa.', 'Mordí el control de la televisión.', 'Lloré toda la noche sin razón aparente.', 'Me comí un poco de arena en el parque.', 'Mis padres me llevaron al pediatra para mis vacunas.', 'Me encanta jugar con mis pies.'],

  teen: ['Pasé todo el verano jugando videojuegos.', 'Me teñí el pelo de un color raro.', 'Fui a mi primer concierto. 🎸', 'Me enamoré de una celebridad.', 'Aprendí a cocinar huevos revueltos.', 'Me volví fan de una banda de K-pop.', 'Pasé horas en redes sociales.'],
  adult: ['Fui a un concierto increíble.', 'Empecé a ver una serie nueva.', 'Aprendí a hacer pan de masa madre. 🍞', 'Me quedé atascad' + 'o/a en un ascensor una hora.', 'Fui a la boda de un viejo amigo.', 'Me compré ropa nueva.', 'Empecé a hacer yoga.', 'Probé un restaurante nuevo. 🍣', 'Me tomé unas vacaciones cortas en la costa.'],
  old: ['Empecé a jugar dominó en el parque.', 'Tejí una bufanda.', 'Les conté historias de mi juventud a los vecinos.', 'Planté tomates en el jardín. 🍅', 'Me quejé del clima todo el año.', 'Aprendí a usar las videollamadas.']
};
function flavor() {
  const a = c.age;
  const l = a < 3 ? FLAVOR.baby : a < 13 ? FLAVOR.kid : a < 18 ? FLAVOR.teen : a < 65 ? FLAVOR.adult : FLAVOR.old;
  return pick(l).replace('o/a', gx('o', 'a'));
}
function randomEvents() {
  const pool = shuffle(EVENTS.filter(ev => c.age >= ev.min && c.age <= ev.max && (!ev.once || !c.seen[ev.id]) && (!ev.cond || ev.cond())));
  let n = 0;
  const max = c.age < 3 ? 1 : 2;
  for (const ev of pool) {
    if (n >= max) break;
    if (chance(ev.p || 0.1)) { n++; c.seen[ev.id] = (c.seen[ev.id] || 0) + 1; fireEvent(ev); }
  }
  if (chance(0.55)) log(flavor());
}
function fireEvent(ev) {
  let x = {};
  try { x = ev.setup ? ev.setup() : {}; } catch (e) { return; }
  const fixLabel = s => s.replace('o/a', gx('o', 'a', x.p || x.k || x.b || null));
  popup({
    icon: ev.icon, title: ev.title, color: ev.color, text: ev.text(x),
    buttons: ev.opts.map(([label, fn]) => ({ label: fixLabel(label), onClick: () => fn(x) }))
  });
}

function profileCard(p, extra = []) {
  const kv = (l, v) => `<div class="kv"><span>${l}</span><span class="bar"><i style="width:${v}%;background:${statColor(v)}"></i></span><span class="v">${Math.round(v)}%</span></div>`;
  const kv2 = (l, v) => `<div class="kv2"><span>${l}</span><b>${esc(v)}</b></div>`;
  let h = `<div class="prof"><div class="prof-top"><div class="prof-av">${avatarOf(p)}</div><div><div class="prof-nm">${esc(fullName(p).trim())}</div><div class="prof-sub">${esc(relLabel(p))} · ${p.alive === false ? `Murió a los ${años(p.deathAge ?? p.age)}` : años(p.age)}</div></div></div>`;
  if (p.alive !== false) h += kv('Relación', p.rel);
  for (const e of extra) h += e[2] === 'bar' ? kv(e[0], e[1]) : kv2(e[0], e[1]);
  return h + '</div>';
}
const infoCard = rows => `<div class="prof">${rows.map(r => r[2] === 'bar' ? `<div class="kv"><span>${r[0]}</span><span class="bar"><i style="width:${r[1]}%;background:${statColor(r[1])}"></i></span><span class="v">${Math.round(r[1])}%</span></div>` : `<div class="kv2"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`;
const needMoney = (n) => { if (c.money < n) { say(`No tengo suficiente dinero. Necesito ${money(n)}.`, { title: 'Sin fondos', icon: '💸' }); return false; } return true; };

  }

    say(g > 0 ? `${cap(nm)} y yo ${what}. 😊` : `Ya pasé mucho tiempo con ${nm} este año.`);

  if (c.age >= 4) A.push({ icon: '🌟', title: 'Elogiar', onClick: () => { relGain(p, 'comp', 1, 6); say(`Le dije a ${nm} que ${pick(['tiene una sonrisa hermosa', 'es muy inteligente', 'es una gran persona', 'se ve increíble hoy', 'cocina delicioso', 'tiene muy buen gusto'])}.`); } });
  // --- según tipo ---
  if (T === 'parent' && c.age >= 5) A.push({ icon: '💵', title: 'Pedir dinero', onClick: () => {
    inc('askMoney');

    yinc('ask' + p.id);
    if (p.rel > 35 && chance(0.4 + p.rel / 200) && p.money > 0) {
      const m = Math.min(p.money, rnd(...ALLOWANCE[c.family]) * (c.age >= 18 ? 4 : 1)); p.money -= m; c.money += m;

      if (Math.abs(p.age - c.age) > 15 && chance(0.7)) { say(`${nm} cree que somos de edades muy distintas.`); return; }
      const pr = 0.25 + (c.stats.looks - p.looks) / 160 + p.rel / 250 + (T === 'ex' ? -0.1 : 0);
      if (chance(pr)) { startRomance(p); popup({ icon: '💕', title: '¡Aceptó!', color: 'var(--rel)', text: `¡${nm} aceptó salir conmigo!` }); closeSheet(); }
      else { relDown(p, 3, 10); stat('happy', -3); say(`${nm} me rechazó. 💔`, { cls: 'bad' }); }
  } });
  if (T === 'friend' && c.age >= 15) A.push({ icon: '🪩', title: 'Salir de fiesta', onClick: () => { relGain(p, 'party', 5, 12); stat('happy', dim('fparty', 6)); inc('nightlife'); say(`${nm} y yo salimos de fiesta toda la noche. 🕺`); } });
  if (c.age >= 18 && !['boss', 'inmate'].includes(T)) A.push({ icon: '💸', title: 'Dar dinero', onClick: () => popup({ icon: '💸', title: 'Dar dinero', text: `¿Cuánto le das a ${nm}?`, buttons: [100, 1000, 10000, 100000].map(n => ({ label: money(n), disabled: c.money < n, onClick: () => { c.money -= n; p.money = (p.money || 0) + n; p.rel = clamp(p.rel + Math.min(30, Math.round(Math.log10(n) * 4))); stat('karma', 2); say(`Le di ${money(n)} a ${nm}. 💸`); } })).concat([{ label: 'Cancelar', cls: 'ghost' }]) }) });
  if (T === 'boss') A.push({ icon: '🍎', title: 'Halagar al jefe', onClick: () => { if (chance(0.6)) { relGain(p, 'boss', 3, 8); if (c.job) c.job.perf = clamp(c.job.perf + dim('bossP', 3)); say('A mi jefe le encantaron mis halagos.'); } else say('Mi jefe notó que le estaba haciendo la pelota. 🙄'); } });
  if (c.age >= 6) {
    A.push({ icon: '🤬', title: 'Insultar', onClick: () => { relDown(p, 6, 15); stat('karma', -2); say(`Le dije a ${nm} que ${pick(['tiene cara de sapo', 'cocina horrible', 'se viste fatal', 'huele raro', 'es la persona más aburrida del mundo', 'nadie l' + gx('o', 'a', p) + ' quiere'])}. 😈`); if (T === 'boss' && c.job) { c.job.perf = clamp(c.job.perf - 15); if (chance(0.3)) fireJob('por insultar a mi jefe'); } } });
    A.push({ icon: '😤', title: 'Discutir', onClick: () => { relDown(p, 3, 10); say(`Discutí con ${nm} sobre ${pick(['dinero', 'política', 'quién lava los platos', 'el control remoto', 'el pasado', 'nada en particular'])}.`); } });
  }
  if (c.age >= 10) A.push({ icon: '👊', title: 'Agredir', onClick: () => popup({ icon: '👊', title: '¿Agredir?', color: 'var(--red)', text: `¿De verdad quieres atacar a ${nm}?`, buttons: [{ label: 'Sí', cls: 'red', onClick: () => assault(p) }, { label: 'No', cls: 'ghost' }] }) });
  if (T === 'friend') A.push({ icon: '✂️', title: 'Terminar amistad', onClick: () => { removeRel(p); say(`Terminé mi amistad con ${nm}.`); closeSheet(); } });
  return A;
}
function assault(p) {
  stat('karma', -8); inc('assaults');
  p.rel = clamp(p.rel - rnd(25, 50));
  if (chance(0.55 + (c.stats.health - 50) / 200)) { stat('happy', 2); say(`Ataqué a ${p.first} y l${gx('o', 'a', p)} dejé con un ojo morado.`); }
  else { stat('health', -rnd(8, 20)); say(`Ataqué a ${p.first}, pero me dio una paliza. 🤕`, { cls: 'bad' }); }
  if (p.type === 'boss' || p.type === 'coworker') { if (c.job) fireJob('por agredir a un compañero'); }
  if (c.age >= 14 && chance(0.25)) arrest('agresión', 0, 3);
}
function giftMenu(p) {
  const G2 = [['Flores', '💐', 40], ['Chocolates', '🍫', 25], ['Perfume', '🧴', 120], ['Ropa de marca', '👗', 400], ['Reloj', '⌚', 1500], ['Joyas', '💎', 5000]];
  popup({ icon: '🎁', title: 'Regalo', text: `¿Qué le regalas a ${p.first}?`, buttons: G2.map(([n, ic, pr]) => ({ label: `${ic} ${n} (${money(pr)})`, disabled: c.money < pr, onClick: () => { c.money -= pr; p.rel = clamp(p.rel + Math.round(4 + Math.log10(pr) * 3)); say(`Le regalé ${n.toLowerCase()} a ${p.first}. ¡Le encantó! ${ic}`); } })).concat([{ label: 'Cancelar', cls: 'ghost' }]) });
}
function propose(p) {
  const rings = [['Anillo sencillo', 500, 0], ['Anillo bonito', 3000, 0.1], ['Anillo de diamantes', 15000, 0.2]];
  popup({ icon: '💍', title: 'Propuesta', color: 'var(--rel)', text: `Elige el anillo para pedirle matrimonio a ${p.first}.`, buttons: rings.map(([n, pr, b]) => ({ label: `${n} (${money(pr)})`, disabled: c.money < pr, onClick: () => {
    c.money -= pr;
    if (chance(p.rel / 110 + b + Math.min(0.15, (p.years || 0) * 0.04) - 0.15)) { p.type = 'fiance'; p.rel = clamp(p.rel + 10); stat('happy', 12); say(`¡${p.first} dijo que SÍ! 💍 Estamos comprometidos.`, { cls: 'good', icon: '💍', title: '¡Comprometidos!', color: 'var(--rel)' }); }
    else { p.rel = clamp(p.rel - rnd(10, 20)); stat('happy', -10); c.money += Math.round(pr * 0.5); say(`${p.first} dijo que no. 💔 Devolví el anillo y recuperé la mitad.`, { cls: 'bad', icon: '💔', title: 'Rechazo' }); }
  } })).concat([{ label: 'Cancelar', cls: 'ghost' }]) });
}
function wedding(p) {
  const W = [['Fugarnos (gratis)', 0, 0], ['Boda pequeña', 5000, 5], ['Boda grande', 30000, 10], ['Boda de lujo', 120000, 15]];
  popup({ icon: '💒', title: 'Boda', color: 'var(--rel)', text: `¿Qué tipo de boda quieren ${p.first} y tú?`, buttons: W.map(([n, pr, h]) => ({ label: `${n}${pr ? ' (' + money(pr) + ')' : ''}`, disabled: c.money < pr, onClick: () => {
    c.money -= pr;
    popup({ icon: '📄', title: 'Acuerdo prenupcial', text: '¿Quieres que firmen un acuerdo prenupcial?', buttons: [
      { label: 'Sí, firmar', onClick: () => { c.flags.prenup = true; p.rel = clamp(p.rel - 5); doWed(p, n, h); } },
      { label: 'No, confío en el amor', cls: 'ghost', onClick: () => doWed(p, n, h) }] });
  } })).concat([{ label: 'Cancelar', cls: 'ghost' }]) });
}
function doWed(p, n, h) {
  p.type = 'spouse'; p.rel = clamp(p.rel + 10 + h); inc('marriages');
  stat('happy', 15 + h);
  log(`¡Me casé con ${fullName(p)}! 💒 (${n.toLowerCase()})`, 'good');
  if (c.gender === 'F' && chance(0.3) && lang() === 'en') { c.last = p.last; log(`Ahora mi apellido es ${p.last}.`); }
  closeAllSheets();
  popup({ icon: '💒', title: '¡Recién casados!', color: 'var(--rel)', text: `¡${p.first} y tú se casaron! Que vivan los novios. 🎉` });
}

<script>
'use strict';
/* =====================================================================
   ACTIVOS
   ===================================================================== */
const YEAR0 = new Date().getFullYear();
function genHouse() {
  const t = pickW(HOUSE_TYPES.map(h => [h, h.w]));
  const beds = rnd(t.b[0], t.b[1]);
  const cond = rnd(30, 100);
  const m2 = Math.round(t.m2 * rnd(80, 135) / 100);
  const value = Math.round(t.base * (m2 / t.m2) * rnd(85, 120) / 100 / 1000) * 1000;
  return { id: uid(), kind: 'house', name: t.n, icon: t.icon, beds, baths: Math.max(1, beds - rnd(0, 2)), m2, built: YEAR0 - rnd(0, 90), cond, value, loc: pick(NEIGHBORHOODS) };
}
function genCar() {
  const [n, icon, base] = pick(CARS);
  const isNew = chance(0.4);
  const age = isNew ? 0 : rnd(1, 15);
  const cond = isNew ? 100 : rnd(25, 95);
  const value = Math.round(base * (isNew ? 1 : Math.pow(0.88, age) * (0.6 + cond / 250)) / 100) * 100;
  return { id: uid(), kind: 'car', name: n, icon, cond, value, year: YEAR0 - age, isNew };
}
function assetsSheet() {
  const it = [];
  const debt = c.loans.reduce((s, l) => s + l.balance, 0);
  it.push({ html: infoCard([['Dinero en el banco', money(c.money)], ['Patrimonio neto', money(netWorth())], ['Deudas', money(debt)]]) });
  const groups = [['Propiedades', 'house'], ['Vehículos', 'car'], ['Joyas', 'jewel'], ['Lujos', 'lux']];
  for (const [g, k] of groups) {
    const L = c.assets.filter(a => a.kind === k);
    if (!L.length) continue;
    it.push({ section: g });
    for (const a of L) it.push({ icon: a.icon, title: a.name, sub: a.kind === 'house' ? `${a.loc}${a.rented ? ' · Alquilada' : ''}` : a.kind === 'car' ? `Modelo ${a.year} · Condición ${a.cond}%` : 'Artículo de lujo', right: shortMoney(assetValue(a)), sheet: () => ownedSheet(a.id) });
  }
  if (c.loans.length) {
    it.push({ section: 'Préstamos' });
    for (const l of c.loans) it.push({ icon: '🧾', title: l.name, sub: `Pago anual ${money(l.payment)}`, right: money(-l.balance), rightCls: 'neg', onClick: () => {
      popup({ icon: '🧾', title: l.name, text: `Te quedan ${money(l.balance)} por pagar. ¿Quieres pagarlo todo ahora?`, buttons: [{ label: `Pagar ${money(l.balance)}`, disabled: c.money < l.balance, onClick: () => { c.money -= l.balance; c.loans = c.loans.filter(x => x !== l); say(`¡Pagué por completo ${l.name.toLowerCase()}! 🎉`, { cls: 'good' }); } }, { label: 'Ahora no', cls: 'ghost' }] });
    } });
  }
  it.push({ section: 'Comprar' });
  if (c.prison) it.push({ html: '<div class="note">No puedes comprar nada desde la prisión. ⛓️</div>' });
  else if (c.age < 18) {
    it.push({ html: `<div class="note">Necesitas ser mayor de edad para comprar propiedades.</div>` });
    if (c.age >= 16 && parentsAlive().length) it.push({ icon: '🚗', title: 'Pedir un auto a mis padres', onClick: () => {
      if (yget('askCar')) { say('Ya les pediste un auto este año.'); return; } yinc('askCar');
      const p = anyParent();
      if ((c.family === 'rica' || (c.family === 'alta' && chance(0.5)) || (c.family === 'media' && chance(0.15))) && p.rel > 50) {
        const car = genCar(); if (c.family !== 'rica') { car.value = Math.min(car.value, 15000); }
        c.assets.push(car); say(`¡${cap(my(p))} me regaló un ${car.name}! 🚗`, { cls: 'good', icon: car.icon, title: '¡Auto nuevo!' });
      } else say(`${cap(my(p))} se rió y me dijo que me consiga un trabajo.`);
    } });
  } else {
    it.push({ icon: '🏠', title: 'Bienes raíces', sub: 'Casas y apartamentos', sheet: housesSheet });
    it.push({ icon: '🚗', title: 'Concesionario', sub: 'Autos nuevos y usados', sheet: carsSheet });
    it.push({ icon: '💍', title: 'Joyería', sheet: () => storeSheet('Joyería', JEWELS, 'jewel') });
    it.push({ icon: '🛥️', title: 'Lujos', sub: 'Yates, aviones, islas…', sheet: () => storeSheet('Lujos', LUXURY, 'lux') });
  }
  return { title: 'Activos', color: 'var(--ast)', items: it };
}
function housesSheet() {
  if (!c.listings.houses) c.listings.houses = Array.from({ length: 8 }, genHouse).sort((a, b) => a.value - b.value);
  return {
    title: 'Bienes raíces', color: 'var(--ast)', items: [
      { html: '<div class="note">Propiedades en venta este año.</div>' },
      ...c.listings.houses.map(h => ({ icon: h.icon, title: `${h.name} en ${h.loc}`, sub: `${h.beds} hab · ${h.baths} baños · ${h.m2} m² · ${h.built} · Cond. ${h.cond}%`, right: shortMoney(h.value), onClick: () => buyHouse(h) }))
    ]
  };
}
function buyHouse(h) {
  const down = Math.round(h.value * 0.2);
  const loan = h.value - down;
  const pay = Math.round(loan * 0.055 / (1 - Math.pow(1.055, -30)));
  const canMort = c.money >= down && (c.job || c.money >= h.value * 0.4) && c.age < 70;
  popup({
    icon: h.icon, title: h.name, color: 'var(--ast)',
    html: `<p>${h.beds} habitaciones · ${h.baths} baños · ${h.m2} m²<br>Construida en ${h.built} · Condición ${h.cond}%<br>Ubicación: ${esc(h.loc)}</p><p style="margin-top:8px"><b style="color:var(--money);font-size:20px">${money(h.value)}</b></p>`,
    buttons: [
      { label: `Pagar de contado`, cls: 'green', disabled: c.money < h.value, onClick: () => { c.money -= h.value; acquire(h); } },
      { label: `Hipoteca (inicial ${shortMoney(down)}, ${shortMoney(pay)}/año × 30)`, disabled: !canMort, onClick: () => { c.money -= down; acquire(h); takeLoan('Hipoteca: ' + h.name, loan, 30, h.id); } },
      { label: 'Cancelar', cls: 'ghost' }
    ]
  });
}
function acquire(a) {
  c.listings.houses = (c.listings.houses || []).filter(x => x !== a);
  c.listings.cars = (c.listings.cars || []).filter(x => x !== a);
  c.assets.push(a); stat('happy', rnd(4, 10));
  log(`Compré ${a.kind === 'house' ? 'una propiedad: ' : ''}${a.name}${a.kind === 'car' ? ' modelo ' + a.year : ''} por ${money(a.value)}. 🔑`, 'good');
  closeSheet();
  popup({ icon: a.icon, title: '¡Es tuy' + (a.kind === 'house' ? 'a' : 'o') + '!', color: 'var(--ast)', text: `Compraste ${a.name} por ${money(a.value)}.` });
}
function carsSheet() {
  if (!c.listings.cars) c.listings.cars = Array.from({ length: 9 }, genCar).sort((a, b) => a.value - b.value);
  return {
    title: 'Concesionario', color: 'var(--ast)', items: [
      { html: '<div class="note">Vehículos disponibles este año.</div>' },
      ...c.listings.cars.map(v => ({ icon: v.icon, title: v.name, sub: `${v.isNew ? 'Nuevo' : 'Usado'} · Modelo ${v.year} · Condición ${v.cond}%`, right: money(v.value), onClick: () => popup({
        icon: v.icon, title: v.name, color: 'var(--ast)', text: `${v.isNew ? 'Nuevo' : 'Usado'}, modelo ${v.year}, condición ${v.cond}%. Precio: ${money(v.value)}.`,
        buttons: [{ label: 'Comprar', cls: 'green', disabled: c.money < v.value, onClick: () => { c.money -= v.value; acquire(v); } }, { label: 'Financiar (5 años)', disabled: c.money < v.value * 0.1 || !c.job, onClick: () => { c.money -= Math.round(v.value * 0.1); acquire(v); takeLoan('Crédito: ' + v.name, Math.round(v.value * 0.9), 5, v.id); } }, { label: 'Cancelar', cls: 'ghost' }]
      }) }))
    ]
  };
}
function storeSheet(title, list, kind) {
  return {
    title, color: 'var(--ast)', items: list.map(([n, ic, pr]) => ({ icon: ic, title: n, right: shortMoney(pr), onClick: () => {
      if (!needMoney(pr)) return;
      c.money -= pr; c.assets.push({ id: uid(), kind, name: n, icon: ic, value: pr, cond: 100 });
      stat('happy', rnd(3, 8)); if (kind === 'lux') stat('fame', 2);
